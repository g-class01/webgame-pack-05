<script>
(function() {
    function dummyBreak(fn) {
        if (typeof fn === 'function') fn();
        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;
    try {
        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>

	<script>

    (function() {
        //Check the game files were all loaded (in a preview, they can be exported
        //again while this page is still loading them).
        if (!gdjs.projectData) {
            throw new Error(
                "The game data was not loaded: some files of the game are missing or could not be read."
            );
        }

        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, gdjs.runtimeGameOptions);

        //Create a renderer
        game.getRenderer().createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
